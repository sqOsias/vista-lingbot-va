[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-wam"
version = "0.1.0"
description = "External visual-memory harness for frozen LingBot-VA on RMBench"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "Pillow>=10,<13",
  "scipy>=1.10,<1.16",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

